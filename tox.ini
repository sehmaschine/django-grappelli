[tox]
envlist = py{312,313,314}-django{52,60,61}

[testenv]
setenv =
    PYTHONDONTWRITEBYTECODE=1
deps =
    -rrequirements/requirements-testing.txt
    coverage
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
commands = ./runtests.py {posargs}
allowlist_externals = *
